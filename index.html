<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Form</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col">
                <h1>Formulario</h1>
                <form>
                    <label class="form-label" for="nome">Seu Nome</label>
                    <input type="text" id="nome" class="form-control">
                    <label class="form-label" for="email">Seu Email</label>
                    <input type="email" id="email" class="form-control">
                    <label class="form-label" for="telefone">Seu telefone</label>
                    <input type="tel" id="telefone" class="form-control">
                    <button class="btn btn-success" style="margin-top: 1.5em;">Enviar</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
